<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Scanity - Comprehensive website security, performance, and code-quality auditing platform" />
    <meta name="keywords" content="website security, performance audit, code quality, vulnerability scanner, SEO analysis" />
    <meta name="author" content="Scanity" />

    <!-- Open Graph meta tags -->
    <meta property="og:title" content="Scanity - Website Security & Performance Auditor" />
    <meta property="og:description" content="Comprehensive website security, performance, and code-quality auditing platform for developers" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/og-image.png" />

    <!-- Twitter Card meta tags -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Scanity - Website Security & Performance Auditor" />
    <meta name="twitter:description" content="Comprehensive website security, performance, and code-quality auditing platform" />
    <meta name="twitter:image" content="/twitter-image.png" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Preconnect to API for faster loads -->
    <link rel="preconnect" href="https://api.scanity.vercel.app" />

    <title>Scanity - Website Security & Performance Auditor</title>

    <style>
      /* Prevent flash of unstyled content */
      body {
        background-color: #0a0a0a;
        color: #ffffff;
      }

      /* Loading spinner */
      .initial-loader {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: #0a0a0a;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 9999;
      }

      .spinner {
        width: 40px;
        height: 40px;
        border: 4px solid #2a2a2a;
        border-top: 4px solid #dc2626;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }

      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <!-- Initial loading indicator -->
      <div class="initial-loader">
        <div class="spinner"></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- Remove initial loader when React app mounts -->
    <script>
      window.addEventListener('load', function() {
        setTimeout(function() {
          const loader = document.querySelector('.initial-loader');
          if (loader) {
            loader.style.opacity = '0';
            setTimeout(() => loader.remove(), 300);
          }
        }, 100);
      });
    </script>
  </body>
</html>
